[project]
name = "disk-manager"
version = "0.1.0"
description = "Local-first disk space analyzer with an interactive web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "send2trash>=1.8.3",
    "Pillow>=10.2.0",
    "PyMuPDF>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
